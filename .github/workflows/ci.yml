name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Smoke test the server
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/home/.claude" "$RUNNER_TEMP/home/projects/demo"
          echo '{"model":"sonnet"}' > "$RUNNER_TEMP/home/.claude/settings.json"
          CC_HOME="$RUNNER_TEMP/home" CC_APP_DIR="$RUNNER_TEMP/app" PORT=4399 bun server/src/index.ts &
          sleep 5
          curl -sf http://127.0.0.1:4399/api/projects | grep -q demo

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install
      - run: bun run compile
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
